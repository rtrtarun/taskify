name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskify
          POSTGRES_PASSWORD: taskify
          POSTGRES_DB: taskify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskify -d taskify"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://taskify:taskify@localhost:5432/taskify?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Must be built with a Go at least as new as go.mod requires.
          version: v2.15.0
      - name: Build
        run: go build ./...
      # taskctl builds for Windows, macOS, and Linux (M13-06).
      - name: Cross-compile taskctl
        run: |
          make build-cli-all
          test "$(ls bin/taskctl-* | wc -l)" -eq 3
      # contract/openapi.yaml must be valid and match the router, and the
      # response validator must refuse what the contract does not describe.
      # The handler and end-to-end tests in the next step validate every
      # response they see against it, so an undocumented status or body
      # fails CI (M12-05).
      - name: Contract
        run: go test ./contract/... ./internal/api/ -run 'TestOpenAPILint|TestSchemas|TestValidator|TestRoutesMatchContract'
      # pkg/client is generated from the contract (M13-01). A contract change
      # without the regenerated client leaves a difference and fails here.
      - name: Generated client is current
        run: |
          make generate
          git diff --exit-code -- pkg/client
          test -z "$(git status --porcelain -- pkg/client)"
      - name: Test
        shell: bash # with pipefail, so a test failure is not hidden by tee
        run: go test -race -cover ./... | tee test-output.txt
      - name: Coverage gate (90% for domain, service, worker, api)
        run: scripts/coverage-gate.sh test-output.txt 90

  # The web frontend (M14). Its API types are generated from the contract
  # (G19): a contract change without regenerated types leaves a difference
  # and fails here.
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated types are current
        run: |
          npm run generate
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - name: Component tests
        run: npm test
      - run: npm run build
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run e2e

  # Every merge to main is versioned and released once the tests pass.
  # See docs/releasing.md.
  release:
    name: Release
    needs: go
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag, create the GitHub Release
      packages: write # push the image to GitHub Container Registry
    concurrency:
      # One release at a time, in merge order; never cancel one half-way.
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, to work out the version

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Work out the version
        id: version
        run: |
          # A re-run of a release that failed part-way finds its tag already
          # on this commit and releases it again.
          existing=$(git tag --points-at HEAD --list 'v[0-9]*' | sort -V | tail -n1)
          if [ -n "$existing" ]; then
            echo "This commit is already tagged $existing; releasing it again."
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          next=$(git log "${last:+$last..}HEAD" --no-merges --format='%B%x00' \
            | go run ./tools/nextversion -last "$last")
          if [ -z "$next" ]; then
            echo "No releasable commits since ${last:-the start of history}; nothing to release."
          else
            echo "Next version: $next (previous: ${last:-none})"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "new=true" >> "$GITHUB_OUTPUT"

      - name: Tag the release
        if: steps.version.outputs.tag != '' && steps.version.outputs.new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Set up Docker Buildx
        if: steps.version.outputs.tag != ''
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.version.outputs.tag != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        if: steps.version.outputs.tag != ''
        # Registry paths must be lower case.
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and publish
        if: steps.version.outputs.tag != ''
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
