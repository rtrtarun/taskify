# Local development stack. The credentials below are for local use only.
#
#   docker compose up --build            Postgres, mock AgentPulse, Taskify
#   docker compose --profile agentpulse up   also the real AgentPulse and Redis
#   AGENTS_ENABLED=true docker compose --profile ollama up
#                                            also Ollama, pulling LLM_MODEL first
#
# Agents can use an Ollama already running on the host instead of the
# profile: AGENTS_ENABLED=true LLM_BASE_URL=http://host.docker.internal:11434/v1
# docker compose up. See "Agents and local models" in README.md.
#
# The real AgentPulse image is not published from this repository. Set
# AGENTPULSE_IMAGE, then point taskify's AGENTPULSE_BASE_URL at it.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskify
      POSTGRES_PASSWORD: taskify
      POSTGRES_DB: taskify
    ports:
      - "5433:5432"   # 5433 on the host: a local PostgreSQL often holds 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskify -d taskify"]
      interval: 2s
      timeout: 3s
      retries: 20

  mock-agentpulse:
    build: .
    entrypoint: ["mock-agentpulse"]
    environment:
      PORT: "9090"
    ports:
      - "9090:9090"

  taskify:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mock-agentpulse:
        condition: service_started
    environment:
      ENV: development
      PORT: "8080"
      DATABASE_URL: postgres://taskify:taskify@postgres:5432/taskify?sslmode=disable
      PUBLIC_BASE_URL: http://localhost:8080
      AGENTPULSE_BASE_URL: http://mock-agentpulse:9090
      AGENTPULSE_API_KEY: dev-agentpulse-key
      AGENTPULSE_WEBHOOK_SECRET: dev-webhook-secret
      JWT_SECRET: dev-secret
      AGENTS_ENABLED: ${AGENTS_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder:7b}
      LLM_API_KEY: ${LLM_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway" # a host Ollama, on Linux too
    ports:
      - "8080:8080"

  ollama:
    profiles: ["ollama"]
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama # models survive restarts; about 5 GB for a 7B model
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-pull:
    profiles: ["ollama"]
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen2.5-coder:7b}"]
    restart: "no"

  redis:
    profiles: ["agentpulse"]
    image: redis:7-alpine

  agentpulse:
    profiles: ["agentpulse"]
    image: ${AGENTPULSE_IMAGE:-agentpulse/notification-service:latest}
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "9091:8080"

volumes:
  pgdata:
  ollama:
